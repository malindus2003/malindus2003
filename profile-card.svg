  <style>
    .ascii-art {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 11.5px;
      fill: #f0f6fc;
      white-space: pre;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .terminal-title {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 13px;
      fill: #8b949e;
      font-weight: 500;
    }
    .section-head {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 13.5px;
      fill: #00C2FF;
      font-weight: 600;
    }
    .key-label {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 12.5px;
      fill: #94a3b8;
      font-weight: 500;
    }
    .val-text {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 12.5px;
      fill: #f8fafc;
      font-weight: 500;
    }
    .val-cyan {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 12.5px;
      fill: #38bdf8;
      font-weight: 600;
    }
    .val-green {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 12.5px;
      fill: #4ade80;
      font-weight: 500;
    }
    .dots {
      font-family: 'Fira Code', 'Courier New', Consolas, monospace;
      font-size: 11.5px;
      fill: #475569;
      letter-spacing: 2.8px;
    }
  </style>

